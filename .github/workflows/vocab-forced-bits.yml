name: Vocabulary forced-bit measurement

on:
  push:
    branches:
      - experiment/vocab-forced-bits
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare compiler
        shell: bash
        run: |
          set -euxo pipefail
          clang++ --version
          if ! command -v clang++-17 >/dev/null 2>&1; then
            sudo ln -sf "$(command -v clang++)" /usr/local/bin/clang++-17
          fi
          clang++-17 --version

      - name: Measure exact forced-bit headroom
        shell: bash
        env:
          CXX: clang++-17
        run: |
          set -euxo pipefail
          chmod +x experiments/vocab-forced-bits/run.sh
          experiments/vocab-forced-bits/run.sh prof_input/input dictionary/english.dic

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vocab-forced-bits
          path: experiments/vocab-forced-bits/out
          if-no-files-found: warn
