name: Hash rank oracle

on:
  push:
    branches:
      - experiment/hash-rank-oracle
  workflow_dispatch:

jobs:
  oracle-byte:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare compiler
        shell: bash
        run: |
          set -euxo pipefail
          clang++ --version
          if ! command -v clang++-17 >/dev/null 2>&1; then
            sudo ln -sf "$(command -v clang++)" /usr/local/bin/clang++-17
          fi
          clang++-17 --version

      - name: Revalidate one exact next-byte sample with private PPMD mmap
        shell: bash
        env:
          CXX: clang++-17
          FX2_ORACLE_WARMUP: "32768"
          FX2_ORACLE_SAMPLES: "1"
          FX2_ORACLE_STRIDE: "65536"
          FX2_ORACLE_OUT_DIR: "experiments/hash-rank-oracle/out-private"
        run: |
          set -euxo pipefail
          chmod +x experiments/hash-rank-oracle/run.sh
          mkdir -p "$FX2_ORACLE_OUT_DIR"
          experiments/hash-rank-oracle/run.sh prof_input/input2 dictionary/english.dic | tee "$FX2_ORACLE_OUT_DIR/action.log"

      - name: Upload oracle results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hash-rank-oracle-private
          path: experiments/hash-rank-oracle/out-private
          if-no-files-found: warn
