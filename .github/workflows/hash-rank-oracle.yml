name: Hash rank oracle16 private

on:
  push:
    branches:
      - experiment/hash-rank-oracle16-private
  workflow_dispatch:

jobs:
  oracle16:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare compiler
        shell: bash
        run: |
          set -euxo pipefail
          clang++ --version
          if ! command -v clang++-17 >/dev/null 2>&1; then
            sudo ln -sf "$(command -v clang++)" /usr/local/bin/clang++-17
          fi
          clang++-17 --version

      - name: Run isolated exact 16-bit prefix oracle
        shell: bash
        env:
          CXX: clang++-17
          FX2_ORACLE16_POSITION: "33822"
          FX2_ORACLE16_NODE_BUDGET: "50000"
          FX2_ORACLE_OUT_DIR: "experiments/hash-rank-oracle/out16-private"
        run: |
          set -euxo pipefail
          chmod +x experiments/hash-rank-oracle/run16.sh
          mkdir -p "$FX2_ORACLE_OUT_DIR"
          experiments/hash-rank-oracle/run16.sh prof_input/input2 dictionary/english.dic | tee "$FX2_ORACLE_OUT_DIR/action.log"

      - name: Upload oracle results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hash-rank-oracle16-private
          path: experiments/hash-rank-oracle/out16-private
          if-no-files-found: warn
