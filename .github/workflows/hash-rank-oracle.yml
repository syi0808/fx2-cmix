name: Hash rank oracle

on:
  push:
    branches:
      - experiment/hash-rank-oracle
  workflow_dispatch:

jobs:
  oracle16:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Prepare compiler
        shell: bash
        run: |
          set -euxo pipefail
          clang++ --version

      - name: Run exact fx2 16-bit branch-and-bound oracle
        shell: bash
        env:
          CXX: clang++
          FX2_ORACLE16_POSITION: "32768"
          FX2_ORACLE16_NODE_BUDGET: "50000"
        run: |
          set -euxo pipefail
          chmod +x experiments/hash-rank-oracle/run16.sh
          mkdir -p experiments/hash-rank-oracle/out16
          experiments/hash-rank-oracle/run16.sh prof_input/input2 dictionary/english.dic | tee experiments/hash-rank-oracle/out16/action.log

      - name: Upload oracle results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hash-rank-oracle16
          path: experiments/hash-rank-oracle/out16
          if-no-files-found: warn
