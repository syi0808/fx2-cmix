name: Byte candidate rank

on:
  push:
    branches:
      - experiment/byte-candidate-rank
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare compiler
        shell: bash
        run: |
          set -euxo pipefail
          clang++ --version
          if ! command -v clang++-17 >/dev/null 2>&1; then
            sudo ln -sf "$(command -v clang++)" /usr/local/bin/clang++-17
          fi
          clang++-17 --version

      - name: Measure PPMD and ByteMixer candidate ranks
        shell: bash
        env:
          CXX: clang++-17
          FX2_BYTE_RANK_WARMUP: "256"
          FX2_BYTE_RANK_LIMIT: "30000"
        run: |
          set -euxo pipefail
          chmod +x experiments/byte-candidate-rank/run.sh
          experiments/byte-candidate-rank/run.sh prof_input/input dictionary/english.dic

      - name: Measure exact PPMD two-byte ranks
        shell: bash
        env:
          CXX: clang++-17
        run: |
          set -euxo pipefail
          chmod +x experiments/byte-candidate-rank/run_pair.sh
          experiments/byte-candidate-rank/run_pair.sh experiments/byte-candidate-rank/out/preprocess.out.cmix.temp

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byte-candidate-rank
          path: experiments/byte-candidate-rank/out
          if-no-files-found: warn
