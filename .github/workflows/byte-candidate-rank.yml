name: Byte candidate rank

on:
  push:
    branches:
      - experiment/byte-candidate-rank
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare compiler
        shell: bash
        run: |
          set -euxo pipefail
          clang++ --version
          if ! command -v clang++-17 >/dev/null 2>&1; then
            sudo ln -sf "$(command -v clang++)" /usr/local/bin/clang++-17
          fi
          clang++-17 --version

      - name: Measure PPMD and ByteMixer candidate ranks
        shell: bash
        env:
          CXX: clang++-17
          FX2_BYTE_RANK_WARMUP: "256"
          FX2_BYTE_RANK_LIMIT: "30000"
        run: |
          set -euxo pipefail
          chmod +x experiments/byte-candidate-rank/run.sh
          experiments/byte-candidate-rank/run.sh prof_input/input dictionary/english.dic

      - name: Measure exact PPMD two-byte ranks
        shell: bash
        env:
          CXX: clang++-17
          FX2_PAIR_RANK_WARMUP: "1024"
          FX2_PAIR_RANK_STRIDE: "113"
          FX2_PAIR_RANK_SAMPLES: "256"
        run: |
          set -euxo pipefail
          chmod +x experiments/byte-candidate-rank/run_pair.sh
          experiments/byte-candidate-rank/run_pair.sh experiments/byte-candidate-rank/out/preprocess.out.cmix.temp

      - name: Measure exact PPMD four-byte ranks and fx2 baseline
        shell: bash
        env:
          CXX: clang++-17
          FX2_BLOCK_RANK_LENGTH: "4"
          FX2_BLOCK_RANK_WARMUP: "1024"
          FX2_BLOCK_RANK_STRIDE: "457"
          FX2_BLOCK_RANK_SAMPLES: "64"
          FX2_BLOCK_RANK_NODE_BUDGET: "250000"
        run: |
          set -euxo pipefail
          chmod +x experiments/byte-candidate-rank/run_block.sh
          experiments/byte-candidate-rank/run_block.sh experiments/byte-candidate-rank/out/preprocess.out.cmix.temp dictionary/english.dic

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byte-candidate-rank
          path: experiments/byte-candidate-rank/out
          if-no-files-found: warn
