name: Byte candidate rank

on:
  push:
    branches:
      - experiment/byte-candidate-rank
  workflow_dispatch:

concurrency:
  group: byte-candidate-rank-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare compiler
        shell: bash
        run: |
          set -euxo pipefail
          clang++ --version
          if ! command -v clang++-17 >/dev/null 2>&1; then
            sudo ln -sf "$(command -v clang++)" /usr/local/bin/clang++-17
          fi
          clang++-17 --version

      - name: Build production objects and predictor fixture
        shell: bash
        env:
          CXX: clang++-17
          FX2_BYTE_RANK_WARMUP: "256"
          FX2_BYTE_RANK_LIMIT: "30000"
        run: |
          set -euxo pipefail
          chmod +x experiments/byte-candidate-rank/run.sh
          experiments/byte-candidate-rank/run.sh prof_input/input dictionary/english.dic

      - name: Probe hard exact PPMD four-byte rank and fx2 baseline
        shell: bash
        env:
          CXX: clang++-17
          FX2_BLOCK_RANK_LENGTH: "4"
          FX2_BLOCK_RANK_WARMUP: "4680"
          FX2_BLOCK_RANK_STRIDE: "1"
          FX2_BLOCK_RANK_SAMPLES: "1"
          FX2_BLOCK_RANK_FORK_BUDGET: "500000"
        run: |
          set -euxo pipefail
          chmod +x experiments/byte-candidate-rank/run_block.sh
          experiments/byte-candidate-rank/run_block.sh experiments/byte-candidate-rank/out/preprocess.out.cmix.temp dictionary/english.dic

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byte-candidate-rank
          path: experiments/byte-candidate-rank/out
          if-no-files-found: warn
